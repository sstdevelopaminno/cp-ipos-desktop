<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f67d8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <title>CpIPOS Desktop</title>
    <style>
      html, body, #root { min-height: 100%; margin: 0; }
      body { background: linear-gradient(135deg, #eef7ff 0%, #f8fbff 46%, #e8f3ff 100%); font-family: Tahoma, Arial, sans-serif; }
      .cpipos-boot-fallback { min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; color: #0f172a; }
      .cpipos-boot-fallback section { width: min(440px, 100%); border: 1px solid #d8e8ff; border-radius: 28px; background: rgba(255,255,255,.92); box-shadow: 0 22px 70px rgba(15, 23, 42, .12); padding: 30px; text-align: center; }
      .cpipos-boot-fallback img { width: 92px; height: 92px; object-fit: contain; filter: drop-shadow(0 12px 22px rgba(37,99,235,.22)); }
      .cpipos-boot-fallback h1 { margin: 18px 0 8px; font-size: 28px; font-weight: 900; color: #0b5ed7; }
      .cpipos-boot-fallback p { margin: 0; color: #475569; line-height: 1.7; }
      .cpipos-boot-fallback small { display: block; margin-top: 14px; color: #64748b; line-height: 1.7; }
      .cpipos-boot-fallback button { margin-top: 18px; min-height: 44px; border: 0; border-radius: 14px; background: #0f67d8; color: #fff; font-weight: 800; padding: 0 18px; cursor: pointer; }
      .cpipos-boot-fallback--error section { border-color: #fecaca; }
      .cpipos-boot-fallback--error h1 { color: #dc2626; }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="cpipos-boot-fallback" data-cpipos-boot-fallback>
        <section>
          <img src="/icon.png" alt="CpIPOS" />
          <h1>CpIPOS Desktop</h1>
          <p>กำลังเปิดระบบขายหน้าร้าน...</p>
          <small>ระบบกำลังโหลดฐานข้อมูลและหน้าจอหลัก</small>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
