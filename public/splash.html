<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CpIPOS Desktop</title>
    <style>
      :root { color: #14213d; background: transparent; font-family: "Segoe UI", Tahoma, sans-serif; }
      * { box-sizing: border-box; }
      html, body { width: 520px; height: 340px; margin: 0; overflow: hidden; }
      body { display: grid; place-items: center; background: radial-gradient(circle at 18% 12%, #d6eeff 0, transparent 40%), linear-gradient(135deg, #ffffff 0%, #eef7ff 100%); }
      .card { width: 100%; height: 100%; display: grid; place-items: center; padding: 26px 34px 24px; text-align: center; border: 1px solid rgba(88, 166, 255, .28); box-shadow: inset 0 0 0 1px rgba(255,255,255,.8); }
      img { width: 184px; height: 184px; object-fit: contain; filter: drop-shadow(0 18px 26px rgba(9, 105, 218, .20)); }
      h1 { margin: 4px 0 10px; color: #0969da; font-size: 32px; line-height: 1; letter-spacing: -.02em; }
      .status { height: 25px; margin: 0; color: #516172; font-size: 16px; font-weight: 700; }
      .spinner { width: 28px; height: 28px; margin: 14px auto 0; border-radius: 50%; border: 3px solid #cfe7ff; border-top-color: #0969da; animation: spin .85s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main class="card" aria-label="CpIPOS Desktop startup">
      <section>
        <img src="/icon.png" alt="CpIPOS" />
        <h1>CpIPOS Desktop</h1>
        <p id="status" class="status">กำลังเตรียมระบบ...</p>
        <div class="spinner" aria-hidden="true"></div>
      </section>
    </main>
    <script>
      const steps = ["กำลังเตรียมระบบ...", "กำลังโหลดฐานข้อมูล...", "กำลังตรวจสอบกะ..."];
      let i = 0;
      setInterval(() => { i = Math.min(i + 1, steps.length - 1); document.getElementById("status").textContent = steps[i]; }, 520);
    </script>
  </body>
</html>
