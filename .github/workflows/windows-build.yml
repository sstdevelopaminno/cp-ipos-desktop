name: Windows Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.3.2"
        required: true
        default: "v0.3.2"
      channel:
        description: "Release channel"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - beta
          - customer-test
  push:
    branches:
      - dev/ui-system
    tags:
      - "v*"

jobs:
  build:
    if: "${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/v') || startsWith(github.event.head_commit.message, 'release: build CpIPOS Desktop v') }}"
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable

      - name: Resolve release metadata
        shell: pwsh
        run: |
          $tag = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $package = Get-Content package.json -Raw | ConvertFrom-Json
            $tag = "v$($package.version)"
          }
          if (-not $tag.StartsWith("v")) { $tag = "v$tag" }
          $channel = "${{ inputs.channel }}"
          if ([string]::IsNullOrWhiteSpace($channel)) { $channel = "stable" }
          "CPIPOS_RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CPIPOS_RELEASE_CHANNEL=$channel" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend stability build
        run: npm run build

      - name: SQLite transaction smoke test
        run: python scripts/test_sqlite_migrations.py

      - name: Rust stability check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build CpIPOS Desktop installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.CPIPOS_RELEASE_TAG }}
          releaseName: "CpIPOS Desktop ${{ env.CPIPOS_RELEASE_TAG }}"
          releaseBody: |
            CpIPOS Desktop Windows installer

            Channel: ${{ env.CPIPOS_RELEASE_CHANNEL }}

            Offline-first POS release for Windows.
            Includes signed offline License enforcement, 7-day trial lock, licensed sales-mode entitlements,
            MDM heartbeat/telemetry, Cloud Backup integration, receipt printing, cash drawer support,
            PromptPay/QR payment, grocery barcode workflow, takeaway mode, dine-in/table mode,
            whole-bill amount/percent discounts with persisted receipt metadata.

            Production activation requires a CUTTING POINT TECH IT-signed License bound to approved device fingerprints.
          releaseDraft: false
          prerelease: ${{ env.CPIPOS_RELEASE_CHANNEL != 'stable' }}

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpipos-desktop-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
