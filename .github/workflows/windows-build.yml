name: Windows Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.2.2"
        required: true
        default: "v0.2.2"
      channel:
        description: "Release channel"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - beta
          - customer-test
  push:
    branches:
      - dev/ui-system
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve release metadata
        shell: pwsh
        run: |
          $tag = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $package = Get-Content package.json -Raw | ConvertFrom-Json
            $tag = "v$($package.version)"
          }
          if (-not $tag.StartsWith("v")) { $tag = "v$tag" }
          $channel = "${{ inputs.channel }}"
          if ([string]::IsNullOrWhiteSpace($channel)) { $channel = "stable" }
          "CPIPOS_RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CPIPOS_RELEASE_CHANNEL=$channel" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Install frontend dependencies
        run: npm ci
      - name: Build CpIPOS Desktop installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.CPIPOS_RELEASE_TAG }}
          releaseName: "CpIPOS Desktop ${{ env.CPIPOS_RELEASE_TAG }}"
          releaseBody: |
            CpIPOS Desktop Windows installer

            Channel: ${{ env.CPIPOS_RELEASE_CHANNEL }}
            License: Free Forever release, license server and MDM connection disabled for this version.
            Includes: startup blank-screen recovery, printer setup shortcut, data archive/reset, cash drawer support, sales keyboard workflow, and close shift 80mm summary printing.
          releaseDraft: false
          prerelease: ${{ env.CPIPOS_RELEASE_CHANNEL != 'stable' }}
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpipos-desktop-windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
